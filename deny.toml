# cargo-deny configuration
# Run with: cargo deny check

[graph]
# Only check dependencies of default features
all-features = false

[advisories]
# Advisory database to check against
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# How to handle advisories
# Note: In cargo-deny v2, advisories are denied by default
# The unmaintained field uses scope ("all", "workspace", "transitive", "none")
unmaintained = "workspace"  # Only fail for direct workspace dependencies
yanked = "warn"

# Adding another ID requires a reachability analysis and a review date in
# docs/AUDIT.md. `unmaintained = "workspace"` means cargo-deny itself does
# not fail on this transitive INFO advisory (hence advisory-not-detected);
# the ignore is kept in lockstep with cargo-audit / rustsec/audit-check.
# cargo-deny 0.20 ignore entries only accept `id`/`reason`; scope is the
# reason (the only parent of `unsafe-libyaml` in Cargo.lock is `serde_yaml_ng`).
ignore = [
    # RUSTSEC-2024-0449 (INFO unmaintained). Reachability:
    #   unsafe-libyaml 0.2.11 → serde_yaml_ng 0.10.0 → lindera 3.0.7
    #     → lance-tokenizer 10.0.0 → lance / lance-index 10.0.0
    #     → lancedb 0.37.1 → ragfs-store
    # lancedb 0.37.1 hardcodes lance-index features `tokenizer-lindera` and
    # `tokenizer-jieba` (still hardcoded in lancedb 0.40.0). ragfs uses
    # FtsIndexBuilder::default() and never lindera YAML configs. Workspace
    # config is TOML; `.yaml` files are extracted as UTF-8 text. No maintained
    # upstream path: lancedb ≥0.38 fails to compile with default features
    # (Dependabot ignores it) and lance-tokenizer 10 pins lindera 3.0.7
    # (lindera 6 dropped YAML). serde_yml is RUSTSEC-2025-0068 (unsound);
    # serde-saphyr has no advisory but we have no YAML API to migrate.
    # Review: 2026-12-31. Issue #160.
    { id = "RUSTSEC-2024-0449", reason = "transitive serde_yaml_ng 0.10.0 via lindera 3.0.7 / lancedb 0.37.1 tokenizer-lindera; no YAML API in this repo; serde_yml is RUSTSEC-2025-0068; see #160" },
]

[licenses]
# Ensure licenses are compatible with our dual MIT/Apache-2.0 license
# Note: In cargo-deny v2, unlicensed and copyleft are denied by default
# Only need to specify allowed licenses

# Allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",          # Boost Software License - used by xxhash-rust
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",             # NCSA License - used by libfuzzer-sys
    "bzip2-1.0.6",      # bzip2 License - used by libbz2-rs-sys
    "CDLA-Permissive-2.0",  # Community Data License - used by webpki-roots
]

# Allow specific crates with non-standard licenses
exceptions = []

# Clarify licenses for crates where detection fails
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Lint multiple versions of the same crate
multiple-versions = "warn"

# Workspace members use `version.workspace = true`; cargo-deny treats that as a
# wildcard. Allow it here so the policy can stay strict everywhere else.
wildcards = "allow"

# Allow workspace dependencies
workspace-default-features = "allow"

# Deny specific crates
deny = []

# Allow specific duplicate crates (when justified)
skip = [
    # Multiple versions needed for transitive dependency compatibility
    { crate = "base64", reason = "Multiple versions required by different deps" },
    { crate = "bitflags", reason = "v1 and v2 both needed" },
    { crate = "zune-jpeg", reason = "Different versions from image and tiff deps" },
]

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific git repos (e.g., for workspace members)
allow-git = []
